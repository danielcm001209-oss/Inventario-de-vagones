<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fichas AVIAM</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.16);
  --text:#e8eaf0;--text2:#8b90a8;
  --accent:#4f7cff;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;
  --teal:#14b8a6;--purple:#c084fc;
  --r:12px;--r2:8px;--font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;}
#app{display:flex;flex-direction:column;height:100%;}

header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 1rem;height:50px;display:flex;align-items:center;gap:.75rem;flex-shrink:0;z-index:10;}
.logo{font-weight:700;font-size:1rem;}
.logo span{color:var(--accent);}
.live{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);border-radius:20px;padding:3px 8px;}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hdr-r{margin-left:auto;display:flex;gap:6px;}
.btn-icon{width:38px;height:38px;border:1px solid var(--border2);border-radius:var(--r2);background:var(--bg3);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.btn-icon:active{background:var(--bg2);transform:scale(.93);}

.stats{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--border);background:var(--border);gap:1px;flex-shrink:0;}
.stat{background:var(--bg2);padding:.6rem .4rem;text-align:center;}
.stat .v{font-size:1.3rem;font-weight:700;line-height:1;display:block;}
.stat .l{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}

.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;}
.tab{flex:1;padding:.8rem;text-align:center;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;user-select:none;}
.tab.on{color:var(--accent);border-color:var(--accent);}

.content{flex:1;overflow:hidden;position:relative;}
.panel{position:absolute;inset:0;overflow-y:auto;display:none;}
.panel.on{display:block;}

/* REGISTRO */
.reg-wrap{padding:1rem;display:flex;flex-direction:column;gap:.85rem;padding-bottom:3rem;}
.big-inp{width:100%;background:var(--bg3);border:2px solid var(--border2);color:var(--text);border-radius:var(--r2);padding:1rem 1.1rem;font-size:1.7rem;font-weight:700;font-family:monospace;outline:none;text-transform:uppercase;letter-spacing:.06em;transition:border-color .15s;-webkit-appearance:none;}
.big-inp:focus{border-color:var(--accent);}
.big-inp.dup{border-color:var(--red);}
.fam-pill{border-radius:var(--r2);padding:.8rem 1rem;font-size:15px;font-weight:600;text-align:center;border:1px solid var(--border2);color:var(--text2);background:var(--bg3);transition:all .2s;}
.fam-pill.fBC{background:rgba(79,124,255,.15);border-color:var(--accent);color:#7fa5ff;}
.fam-pill.fBCB{background:rgba(20,184,166,.15);border-color:var(--teal);color:var(--teal);}
.fam-pill.fBCTB{background:rgba(245,158,11,.15);border-color:var(--amber);color:var(--amber);}
.fam-pill.fVBIP{background:rgba(192,132,252,.15);border-color:var(--purple);color:var(--purple);}
.fam-pill.fNONE{background:rgba(239,68,68,.1);border-color:var(--red);color:var(--red);}
.dup-warn{font-size:13px;color:var(--red);text-align:center;display:none;font-weight:600;}
.btn-reg{width:100%;padding:1.1rem;background:var(--accent);color:#fff;border:none;border-radius:var(--r2);font-size:18px;font-weight:700;cursor:pointer;transition:all .15s;-webkit-appearance:none;}
.btn-reg:active{transform:scale(.97);background:#3a65e8;}
.btn-reg:disabled{background:var(--bg3);color:var(--text2);}
.rec-section h2{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.6rem;}
.rec-list{display:flex;flex-direction:column;gap:6px;}
.rec{display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:var(--r2);padding:.6rem .75rem;}
.rc{font-family:monospace;font-weight:700;font-size:14px;flex:1;}
.btn-dx{background:none;border:1px solid var(--border2);color:var(--text2);cursor:pointer;font-size:13px;padding:5px 9px;border-radius:4px;min-width:34px;min-height:34px;display:flex;align-items:center;justify-content:center;}
.btn-dx:active{border-color:var(--red);color:var(--red);}

/* LISTA */
.list-wrap{padding:.85rem;display:flex;flex-direction:column;gap:.75rem;}
.search-inp{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:var(--r2);padding:.7rem .9rem;font-size:15px;outline:none;-webkit-appearance:none;}
.search-inp:focus{border-color:var(--accent);}
.filt-row{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:2px;}
.filt-row::-webkit-scrollbar{display:none;}
.filt{padding:.5rem .95rem;border:1px solid var(--border2);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s;}
.filt.on{border-color:var(--accent);color:#7fa5ff;background:rgba(79,124,255,.1);}
.tbl-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.tbl-hd{padding:.65rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem;}
.tbl-hd h3{font-size:13px;font-weight:600;}
.cnt{background:var(--bg3);color:var(--text2);border-radius:20px;font-size:11px;padding:2px 8px;}
.card-list{display:flex;flex-direction:column;}
.fcard{display:flex;align-items:center;gap:10px;padding:.7rem 1rem;border-bottom:1px solid rgba(255,255,255,.04);}
.fcard:last-child{border-bottom:none;}
.fcard:active{background:rgba(255,255,255,.03);}
.fcard-num{font-size:11px;color:var(--text2);min-width:22px;}
.fcard-ficha{font-family:monospace;font-weight:700;font-size:16px;flex:1;}
.fcard-right{display:flex;align-items:center;gap:8px;}
.fcard-ts{font-size:11px;color:var(--text2);}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase;}
.tBC{background:rgba(79,124,255,.2);color:#7fa5ff;}
.tBCB{background:rgba(20,184,166,.2);color:var(--teal);}
.tBCTB{background:rgba(245,158,11,.2);color:var(--amber);}
.tVBIP{background:rgba(192,132,252,.2);color:var(--purple);}
.btn-del{padding:5px 9px;background:transparent;border:1px solid var(--border2);color:var(--text2);border-radius:4px;cursor:pointer;font-size:12px;min-width:34px;min-height:34px;display:flex;align-items:center;justify-content:center;}
.btn-del:active{border-color:var(--red);color:var(--red);}
.fcard-dup{background:rgba(245,158,11,.07);border-left:3px solid var(--amber);}
.fcard-dup .fcard-ficha{color:var(--amber);}
.dup-badge{display:inline-block;font-size:10px;font-weight:700;background:rgba(245,158,11,.25);color:var(--amber);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;}
.filt-dup{border-color:rgba(245,158,11,.4);color:var(--amber);}
.filt-dup.on{border-color:var(--amber);background:rgba(245,158,11,.1);color:var(--amber);}
#toast.warn{border-color:var(--amber);color:var(--amber);}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--text2);}
.empty b{display:block;color:var(--text);font-size:1rem;margin-bottom:.3rem;}

#toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:.65rem 1.4rem;font-size:14px;font-weight:600;z-index:9999;opacity:0;transition:all .25s;white-space:nowrap;pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
#toast.ok{border-color:var(--green);color:var(--green);}
#toast.err{border-color:var(--red);color:var(--red);}
#toast.inf{border-color:var(--accent);color:#7fa5ff;}

@media(min-width:700px){
  html,body{height:auto;overflow:auto;}
  #app{height:auto;min-height:100vh;}
  .content{overflow:visible;height:auto;display:flex;}
  .panel{position:static;display:none;}
  .panel.on{display:block;}
  .tabs{display:none;}
  #panel-reg{display:block;width:300px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;}
  #panel-list{display:block;flex:1;overflow-y:auto;}
  .big-inp{font-size:1.3rem;padding:.75rem 1rem;}
  .btn-reg{font-size:15px;padding:.9rem;}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">Fichas <span>AVIAM</span></div>
    <div class="live"><span class="dot"></span><span id="live-txt">Conectando…</span></div>
    <div class="hdr-r">
      <button class="btn-icon" onclick="exportExcel()" title="Exportar Excel">⬇</button>
      <button class="btn-icon" onclick="borrarTodo()" title="Borrar todo">🗑</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><span class="v" id="sBC"   style="color:var(--accent)">0</span><span class="l">BC</span></div>
    <div class="stat"><span class="v" id="sBCB"  style="color:var(--teal)">0</span><span class="l">BCB</span></div>
    <div class="stat"><span class="v" id="sBCTB" style="color:var(--amber)">0</span><span class="l">BCTB</span></div>
    <div class="stat"><span class="v" id="sVBIP" style="color:var(--purple)">0</span><span class="l">VBIP</span></div>
    <div class="stat"><span class="v" id="sTOT"  style="color:var(--green)">0</span><span class="l">Total</span></div>
  </div>

  <div class="tabs">
    <div class="tab on" id="tab-reg"  onclick="switchTab('reg')">Registrar</div>
    <div class="tab"    id="tab-list" onclick="switchTab('list')">Lista</div>
  </div>

  <div class="content">
    <div class="panel on" id="panel-reg">
      <div class="reg-wrap">
        <input class="big-inp" id="inp-f" placeholder="BC04…"
          oninput="onInput()" onkeydown="onKey(event)"
          autocomplete="off" autocorrect="off" autocapitalize="characters"
          spellcheck="false" />
        <div class="fam-pill" id="pill">– familia –</div>
        <div class="dup-warn" id="dup-w">⚠ Ya existe — se registrará como duplicada</div>
        <button class="btn-reg" id="btn-reg" onclick="registrar()">+ Registrar</button>
        <div class="rec-section">
          <h2>Últimos registros</h2>
          <div class="rec-list" id="rec-list"><div style="color:var(--text2);font-size:13px;">Sin registros aún</div></div>
        </div>
      </div>
    </div>

    <div class="panel" id="panel-list">
      <div class="list-wrap">
        <input class="search-inp" type="text" id="search" placeholder="Buscar ficha…" oninput="render()" />
        <div class="filt-row">
          <button class="filt on" id="fTODOS" onclick="setFilt('TODOS')">Todos</button>
          <button class="filt" id="fBC"   onclick="setFilt('BC')">BC</button>
          <button class="filt" id="fBCB"  onclick="setFilt('BCB')">BCB</button>
          <button class="filt" id="fBCTB" onclick="setFilt('BCTB')">BCTB</button>
          <button class="filt" id="fVBIP" onclick="setFilt('VBIP')">VBIP</button>
          <button class="filt filt-dup" id="fDUP" onclick="setFilt('DUP')">⚠ Duplicadas</button>
        </div>
        <div class="tbl-wrap">
          <div class="tbl-hd">
            <h3>Fichas registradas</h3>
            <span class="cnt" id="tbl-cnt">0</span>
          </div>
          <div id="tbl-body"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let db=null,unsub=null,records=[],activeFilt='TODOS';
const COL='inventario_fichas';
const FB_CFG={
  apiKey:"AIzaSyBW40Lo6R2p4L-Aq0pZrKrPYpxXjg7p8Co",
  authDomain:"vagones-inventario.firebaseapp.com",
  projectId:"vagones-inventario",
  storageBucket:"vagones-inventario.firebasestorage.app",
  messagingSenderId:"992932665061",
  appId:"1:992932665061:web:032e344656cd2ffda3260c"
};

window.addEventListener('load',()=>{
  try{
    if(!firebase.apps.length)firebase.initializeApp(FB_CFG);
    db=firebase.firestore();
    listen();
  }catch(e){toast('Error Firebase: '+e.message,'err');}
});

function listen(){
  if(unsub)unsub();
  document.getElementById('live-txt').textContent='Conectando…';
  unsub=db.collection(COL).orderBy('ts','desc').onSnapshot(snap=>{
    records=snap.docs.map(d=>({id:d.id,...d.data()}));
    updateStats();render();renderRec();
    document.getElementById('live-txt').textContent=`En línea · ${records.length}`;
    onInput();
  },()=>document.getElementById('live-txt').textContent='⚠ Sin conexión');
}

function switchTab(t){
  ['reg','list'].forEach(x=>{
    document.getElementById('tab-'+x).className='tab'+(x===t?' on':'');
    document.getElementById('panel-'+x).className='panel'+(x===t?' on':'');
  });
  if(t==='reg')setTimeout(()=>document.getElementById('inp-f').focus(),100);
}

function detectFam(raw){
  const v=raw.trim().toUpperCase().replace(/[-_ ]/g,'');
  if(v.startsWith('VBIP'))return'VBIP';
  if(v.startsWith('BCTB'))return'BCTB';
  if(v.startsWith('BCB'))return'BCB';
  if(v.startsWith('BC'))return'BC';
  return null;
}

function onInput(){
  const val=document.getElementById('inp-f').value;
  const fam=detectFam(val);
  const pill=document.getElementById('pill');
  pill.className='fam-pill'+(fam?' f'+fam:(val.trim()?' fNONE':''));
  pill.textContent=fam?'✓ Familia: '+fam:(val.trim()?'No reconocida':'– familia –');
  const ficha=val.trim().toUpperCase();
  const dup=ficha&&records.some(r=>r.ficha===ficha);
  document.getElementById('inp-f').className='big-inp'+(dup?' dup':'');
  document.getElementById('dup-w').style.display=dup?'block':'none';
}

function onKey(e){if(e.key==='Enter')registrar();}

async function registrar(){
  const raw=document.getElementById('inp-f').value;
  const ficha=raw.trim().toUpperCase();
  if(!ficha){toast('Escribe el código de la ficha','err');return;}
  const fam=detectFam(ficha);
  if(!fam){toast('Familia no reconocida','err');return;}
  const dup=records.some(r=>r.ficha===ficha);
  const btn=document.getElementById('btn-reg');
  btn.disabled=true;
  try{
    await db.collection(COL).add({ficha,familia:fam,duplicada:dup,ts:firebase.firestore.FieldValue.serverTimestamp()});
    document.getElementById('inp-f').value='';
    onInput();
    document.getElementById('inp-f').focus();
    toast(dup?'⚠ '+ficha+' registrada (duplicada)':ficha+' ✓', dup?'warn':'ok');
  }catch(e){toast('Error: '+e.message,'err');}
  btn.disabled=false;
}

async function eliminar(id,ficha){
  if(!confirm('¿Eliminar '+ficha+'?'))return;
  await db.collection(COL).doc(id).delete();
  toast(ficha+' eliminada','inf');
}

async function borrarTodo(){
  if(!records.length){toast('No hay registros','err');return;}
  if(!confirm('¿Borrar TODOS los '+records.length+' registros?\nNo se puede deshacer.'))return;
  const batch=db.batch();
  records.forEach(r=>batch.delete(db.collection(COL).doc(r.id)));
  await batch.commit();
  toast('Inventario borrado','inf');
}

function updateStats(){
  ['BC','BCB','BCTB','VBIP'].forEach(f=>document.getElementById('s'+f).textContent=records.filter(r=>r.familia===f).length);
  document.getElementById('sTOT').textContent=records.length;
}

function setFilt(f){
  activeFilt=f;
  document.querySelectorAll('.filt').forEach(b=>b.classList.remove('on'));
  document.getElementById('f'+f).classList.add('on');
  render();
}

function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  let rows=[...records];
  if(activeFilt==='DUP'){
    // find fichas that appear more than once
    const counts={};
    records.forEach(r=>{counts[r.ficha]=(counts[r.ficha]||0)+1;});
    rows=rows.filter(r=>counts[r.ficha]>1);
  } else if(activeFilt!=='TODOS'){
    rows=rows.filter(r=>r.familia===activeFilt);
  }
  if(q)rows=rows.filter(r=>r.ficha.toLowerCase().includes(q));
  document.getElementById('tbl-cnt').textContent=rows.length;
  if(!rows.length){
    document.getElementById('tbl-body').innerHTML='<div class="empty"><b>Sin resultados</b>Prueba otro filtro.</div>';
    return;
  }
  // build a count map to detect duplicates in current full dataset
  const counts={};
  records.forEach(r=>{counts[r.ficha]=(counts[r.ficha]||0)+1;});
  document.getElementById('tbl-body').innerHTML='<div class="card-list">'+rows.map((r,i)=>{
    const ts=r.ts?.toDate?r.ts.toDate():new Date();
    const fmt=ts.toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'});
    const isDup=counts[r.ficha]>1;
    return`<div class="fcard${isDup?' fcard-dup':''}">
      <span class="fcard-num">${i+1}</span>
      <span class="fcard-ficha">${r.ficha}${isDup?'<span class="dup-badge">×'+counts[r.ficha]+'</span>':''}</span>
      <div class="fcard-right">
        <span class="tag t${r.familia}">${r.familia}</span>
        <span class="fcard-ts">${fmt}</span>
        <button class="btn-del" onclick="eliminar('${r.id}','${r.ficha}')">✕</button>
      </div>
    </div>`;
  }).join('')+'</div>';
}

function renderRec(){
  const last=records.slice(0,8);
  document.getElementById('rec-list').innerHTML=last.length
    ?last.map(r=>`<div class="rec"><span class="tag t${r.familia}">${r.familia}</span><span class="rc">${r.ficha}</span><button class="btn-dx" onclick="eliminar('${r.id}','${r.ficha}')">✕</button></div>`).join('')
    :'<div style="color:var(--text2);font-size:13px;">Sin registros aún</div>';
}

function exportExcel(){
  if(!records.length){toast('No hay datos','err');return;}
  const wb=XLSX.utils.book_new();
  const counts={};
  records.forEach(r=>{counts[r.ficha]=(counts[r.ficha]||0)+1;});
  const all=records.map((r,i)=>{
    const ts=r.ts?.toDate?r.ts.toDate():new Date();
    return{'N°':i+1,'FICHA':r.ficha,'FAMILIA':r.familia,
      'DUPLICADA':counts[r.ficha]>1?'SÍ':'',
      'FECHA':ts.toLocaleDateString('es-DO'),
      'HORA':ts.toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'})};
  });
  const ws=XLSX.utils.json_to_sheet(all);
  ws['!cols']=[{wch:5},{wch:12},{wch:8},{wch:10},{wch:12},{wch:8}];
  XLSX.utils.book_append_sheet(wb,ws,'REGISTROS');
  const fams=['BC','BCB','BCTB','VBIP'];
  const res=fams.map(f=>({'FAMILIA':f,'CANTIDAD':records.filter(r=>r.familia===f).length}));
  res.push({'FAMILIA':'TOTAL GENERAL','CANTIDAD':records.length});
  const ws2=XLSX.utils.json_to_sheet(res);
  ws2['!cols']=[{wch:15},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws2,'RESUMEN');
  fams.forEach(f=>{
    const fr=records.filter(r=>r.familia===f).map((r,i)=>({'N°':i+1,'FICHA':r.ficha}));
    if(fr.length){const wsf=XLSX.utils.json_to_sheet(fr);wsf['!cols']=[{wch:5},{wch:12}];XLSX.utils.book_append_sheet(wb,wsf,f);}
  });
  const d=new Date();
  XLSX.writeFile(wb,`Inventario_Fichas_PUJ_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.xlsx`);
  toast('Excel exportado','ok');
}

function toast(msg,type='inf'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='show '+type;
  clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2500);
}
</script>
</body>
</html>
